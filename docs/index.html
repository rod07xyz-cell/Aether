<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreAutomatic - TikTok Auto Publisher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .logo { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #aaa; font-size: 1.1rem; margin-bottom: 2rem; text-align: center; max-width: 500px; }
    .features { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem; }
    .feature { background: #111; border: 1px solid #222; border-radius: 12px; padding: 1.2rem 1.5rem; text-align: center; width: 160px; }
    .feature .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .feature p { color: #ccc; font-size: 0.9rem; margin: 0; }
    .links { display: flex; gap: 1rem; }
    a { color: #fe2c55; text-decoration: none; border: 1px solid #fe2c55; padding: 0.6rem 1.4rem; border-radius: 8px; font-size: 0.95rem; transition: background 0.2s; }
    a:hover { background: #fe2c55; color: #fff; }
  </style>
</head>
<body>
  <div class="logo">🎬</div>
  <h1>CreAutomatic</h1>
  <p>Automated TikTok content publisher. Finds copyright-free viral videos and posts them to your TikTok account on a schedule.</p>
  <div class="features">
    <div class="feature"><div class="icon">🔍</div><p>Auto video search</p></div>
    <div class="feature"><div class="icon">✂️</div><p>9:16 crop & edit</p></div>
    <div class="feature"><div class="icon">📅</div><p>Scheduled posting</p></div>
    <div class="feature"><div class="icon">🔐</div><p>TikTok OAuth</p></div>
  </div>
  <div class="links">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</body>
</html>
